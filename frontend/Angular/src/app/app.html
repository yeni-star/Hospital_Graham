<div *ngIf="!estaLogueado" style="text-align: center; margin-top: 100px;">
  <h2>Bienvenido al Sistema de Alertas Médicas</h2>
  <p>Para continuar, debes autenticarte en el sistema de seguridad del hospital.</p>
  
  <button (click)="iniciarSesion()" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #0078d4; color: white; border: none; border-radius: 4px; margin-top: 20px;">
    Ingresar al Sistema
  </button>
</div>

<div *ngIf="estaLogueado">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #e3f2fd; border-bottom: 2px solid #90caf9;">
    <h1 style="margin: 0; color: #1565c0;">Hospital - Alertas Médicas</h1>
    <button (click)="cerrarSesion()" style="padding: 8px 16px; cursor: pointer; background-color: #d32f2f; color: white; border: none; border-radius: 4px;">
      Cerrar Sesión
    </button>
  </header>
  
  <main style="padding: 30px;">
    <h3>Panel de Pacientes Críticos</h3>
    <router-outlet></router-outlet>
  </main>
</div>
